[project]
name = "phototag"
version = "0.1.0"
description = "WikiTree PhotoTag (unofficial): local-first family photo tagger: find faces, name each person once, export photos of deceased relatives for their WikiTree profiles."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["opencv-python-headless>=4.10", "numpy>=1.26", "pillow>=10", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
phototag = "phototag.cli:main"

[tool.setuptools]
packages = ["phototag"]

[tool.setuptools.package-data]
phototag = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
